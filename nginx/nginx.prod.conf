# ─────────────────────────────────────────────
#  Nginx — LMS Reverse Proxy (Production)
#  Routes: /api/* → backend:5000
#          /*     → frontend:80 (Production build served via frontend container Nginx)
#          /lmsdata/uploads/public/* → static files (no auth)
# ─────────────────────────────────────────────

worker_processes auto;

events {
  worker_connections 1024;
}

http {

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Performance ────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  gzip               on;
  gzip_types         text/plain text/css application/json
                     application/javascript text/xml
                     application/xml application/xml+rss
                     text/javascript;

  # ── Upload size limit ──────────────────────
  client_max_body_size 500M;

  # ── Docker DNS resolver (prevents stale IP after container restart) ──
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ── Rate limiting zones ────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  # ── HTTP server block ─────────────
  server {
    listen 80;
    server_name _;

    set $backend_upstream http://backend:5000;
    set $frontend_upstream http://frontend:80;  # Production frontend container listens on port 80

    # Auth endpoints
    location ~ ^/api/v1/auth/(login|register|refresh) {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass         $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }

    # API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass         $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Public static files
    location /lmsdata/uploads/courses/ {
      alias /app/lmsdata/uploads/courses/;
      expires 7d;
      add_header Cache-Control "public, immutable";
      location ~* \.(jpg|jpeg|png|webp|gif)$ {
        try_files $uri =404;
      }
    }

    location /lmsdata/ {
      return 403;
    }

    # Frontend
    location / {
      proxy_pass         $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

}
